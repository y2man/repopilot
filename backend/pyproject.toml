[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot-api"
version = "0.1.0"
description = "AI-powered repository intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pgvector>=0.3,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.27,<1.0",
  "celery[redis]>=5.4,<6.0",
  "cryptography>=43,<47",
  "tree-sitter-language-pack>=0.9,<1.0",
]

[project.optional-dependencies]
ai = ["sentence-transformers>=3.0,<6.0"]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0", "ruff>=0.6,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*"]
